databaseChangeLog:
  - changeSet:
      id: v0.1.0-create-tracked-company-table
      author: esg-trazabilidad
      changes:
        - createTable:
            tableName: tracked_company
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: ruc
                  type: varchar(11)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: association_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
