# Test-only value. SecurityConfig imports shared-kernel's JwtSecurityConfig,
# whose decoder requires JWT_SECRET at startup, so every @SpringBootTest
# context needs it -- including WebEnvironment.NONE persistence/event ITs.
# Locally ../.env.local also supplies one; CI has no .env.local, so without
# this those contexts fail to start there. Classes that sign tokens pin their
# own value via @TestPropertySource (TestJwtTokens.TEST_SECRET), which wins
# over this file.
JWT_SECRET=collection-service-test-only-secret-at-least-32-bytes

# Evidence storage has no defaults for the bucket or the credentials, so every context needs
# placeholders. They are inert: no test reaches a real bucket (the storage is an in-memory double,
# or a local stub server for the adapter's own test), and nothing here is a real credential.
# The daily retention job stays off in tests: they run the job themselves (RetentionRunner), with the time
# they choose, so a scheduled run can never interleave with them.
esg.retention.job.enabled=false

B2_BUCKET=test-bucket
B2_KEY_ID=test-id
B2_APPLICATION_KEY=test-secret
