# Test-only value. SecurityConfig imports shared-kernel's JwtSecurityConfig,
# whose decoder requires JWT_SECRET at startup, so every @SpringBootTest
# context needs it -- including WebEnvironment.NONE persistence/event ITs.
# Locally ../.env.local also supplies one; CI has no .env.local, so without
# this those contexts fail to start there. Classes that sign tokens pin their
# own value via @TestPropertySource (TestJwtTokens.TEST_SECRET), which wins
# over this file.
JWT_SECRET=recycler-service-test-only-secret-at-least-32-bytes
