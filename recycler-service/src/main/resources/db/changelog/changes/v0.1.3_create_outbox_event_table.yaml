databaseChangeLog:
  - changeSet:
      id: v0.1.3-create-outbox-event-table
      author: esg-trazabilidad
      comment: >
        Named outbox_event_recycler (not outbox_event): collection-service and
        recycler-service share one Postgres database with no per-service schema
        separation, so each service's outbox table needs a distinct name to
        avoid a create-table collision -- the same reasoning already applied to
        shedlock_recycler/shedlock_collection, extended here after it was
        caught live (recycler-service failed to boot with "relation
        outbox_event already exists" the first time both services' schemas
        were verified together). See SPEC-cross-service-events.md's Resolved
        Decisions.
      changes:
        - createTable:
            tableName: outbox_event_recycler
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: routing_key
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: payload_json
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
  - changeSet:
      id: v0.1.3-outbox-event-recycler-status-created-at-index
      author: esg-trazabilidad
      comment: >
        Speeds up OutboxDispatcher's every-5s poll for NEW/FAILED rows ordered
        by age. Index name is also namespaced per service -- Postgres index
        names share the same per-schema namespace as table names, so a plain
        ix_outbox_event_status_created_at would collide with
        collection-service's own index the same way the bare table name did.
      changes:
        - createIndex:
            tableName: outbox_event_recycler
            indexName: ix_outbox_event_recycler_status_created_at
            columns:
              - column:
                  name: status
              - column:
                  name: created_at
