org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# On this Windows machine an antivirus intercepts TLS with its own certificate, which the JDK's trust store does
# not know: without this, the wrapper and Gradle fail with "PKIX path building failed". Using the Windows
# certificate store makes the JVM trust what the machine already trusts. Harmless where there is no interception.
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT
