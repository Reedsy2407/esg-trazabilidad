spring:
  application:
    name: collection-service
  config:
    import: "optional:file:../.env.local[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/esg_trazabilidad}
    username: ${DB_USERNAME:esg}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:esg}
    password: ${RABBITMQ_PASSWORD}
    # CloudAMQP: vhost = the instance's user, amqps on 5671. Local compose: "/" and plaintext 5672.
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoint:
    health:
      probes:
        # Auto-enabled only on Kubernetes; Render isn't, so turn it on explicitly.
        # /actuator/health/liveness is Render's health check (SPEC-deployment.md).
        enabled: true

server:
  # Render injects PORT; locally the fixed default applies. e2e-tests' SERVER_PORT still wins.
  port: ${PORT:8082}
