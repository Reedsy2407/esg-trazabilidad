spring:
  application:
    name: auth-service
  config:
    import: "optional:file:../.env.local[.properties]"
  autoconfigure:
    # auth-service publishes and consumes nothing. shared-kernel's
    # spring-boot-starter-amqp would still switch on Spring's Rabbit
    # auto-configuration (plus a Rabbit health indicator that fails the
    # aggregate /actuator/health without a broker) and shared-kernel's
    # topology/listener AMQP config, so all three are excluded here.
    # shared-kernel's OutboxDispatcher needs no exclusion: it only exists
    # with an OutboxRepository bean, and auth-service has none. That is also
    # why this file has no spring.rabbitmq block.
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - pe.esgtrazabilidad.kernel.amqp.RabbitTopologyConfig
      - pe.esgtrazabilidad.kernel.amqp.RabbitListenerConfig
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/esg_trazabilidad}
    username: ${DB_USERNAME:esg}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoint:
    health:
      probes:
        # Auto-enabled only on Kubernetes; Render isn't, so turn it on explicitly.
        # /actuator/health/liveness is Render's health check (SPEC-deployment.md).
        enabled: true

server:
  # Render injects PORT; locally the fixed default applies. e2e-tests' SERVER_PORT still wins.
  port: ${PORT:8084}
