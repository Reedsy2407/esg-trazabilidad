name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test full reactor
        run: mvn -B verify

  # Secret scan of the whole git history with gitleaks (default rules plus the
  # per-commit/file/line allowlist in .gitleaks.toml). Any new match fails the
  # job; --redact keeps matched values out of the log. Pinned release binary,
  # checked against the release's own checksums file.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan history for secrets (gitleaks)
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

  # Which parts of the repo this push or PR touched. Native git, no third-party
  # action. An unknown base (first push, force push) counts as "changed".
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The frontend job also runs when this workflow itself changes, so a
          # change to the job is always exercised by its own push.
          if git diff --name-only "$BASE" HEAD | grep -qE '^frontend-demo/|^\.github/workflows/ci\.yml$'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  # frontend-demo/ only: lint, unit tests (Vitest on jsdom, no browser) and the
  # production build, then the Playwright browser flows.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-demo/package-lock.json

      - name: Install (lockfile only)
        run: npm ci

      # Known high/critical advisories in what ships to the browser only;
      # dev tooling (Angular CLI, Vitest, Playwright) never reaches it.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build

      # Browser flows against `ng serve` with the backend faked per test
      # (e2e/backend.ts): no network, no secrets. Includes AXE and the
      # 360/768/1280 px layout checks.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser flows (Playwright)
        run: npx playwright test

      - name: Keep Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend-demo/test-results/
          retention-days: 7
