# gitleaks configuration (CI: .github/workflows/ci.yml, job "secrets").
# The default rules, plus one allowlist entry per known false positive. Each
# entry needs ALL of: the commit that added the line, the file, and the exact
# line text (gitleaks has no line-number field, so the line is pinned by its
# content). Nothing is allowlisted by rule, so a new match anywhere else, or a
# changed line here, still fails CI. Reviewed 2026-10-10 (portal: lista de seguridad).
# The line regexes start with \s* because gitleaks may hand the line over with
# its leading newline.

[extend]
useDefault = true

# A UUID used as the subject of a locally signed test token (not a secret).
[[allowlists]]
description = "recycler-service IT token subject (UUID)"
condition = "AND"
commits = ["292ec2f54fb6ea49fb25e693512aff90bbbff9a2"]
paths = ['''^recycler-service/src/test/java/pe/esgtrazabilidad/recycler/it/support/TestJwtTokens\.java$''']
regexTarget = "line"
regexes = ['''^\s*return signToken\(TEST_SECRET, "01a0d8cb-f219-72a2-b006-5150f0e0d685"\);\s*$''']

[[allowlists]]
description = "collection-service IT token subject (UUID)"
condition = "AND"
commits = ["738ad81ff4b4bfa243c73938edc21d796222a69c"]
paths = ['''^collection-service/src/test/java/pe/esgtrazabilidad/collection/it/support/TestJwtTokens\.java$''']
regexTarget = "line"
regexes = ['''^\s*return signToken\(TEST_SECRET, "01a0d8cb-f219-72a2-b006-5150f0e0d685"\);\s*$''']

[[allowlists]]
description = "reporting-service IT token subject (UUID)"
condition = "AND"
commits = ["e34aef01ae61a4c638c8481b961618ea5af6c8d9"]
paths = ['''^reporting-service/src/test/java/pe/esgtrazabilidad/reporting/it/support/TestJwtTokens\.java$''']
regexTarget = "line"
regexes = ['''^\s*return signToken\(TEST_SECRET, "01a0d8cb-f219-72a2-b006-5150f0e0d685"\);\s*$''']

[[allowlists]]
description = "collection-service IT token subject (UUID), NeighborDeletionApiIT"
condition = "AND"
commits = ["965dec518b84d9949940f5724838073902e8be07"]
paths = ['''^collection-service/src/test/java/pe/esgtrazabilidad/collection/it/NeighborDeletionApiIT\.java$''']
regexTarget = "line"
regexes = ['''^\s*private static final String TOKEN_SUBJECT = "01a0d8cb-f219-72a2-b006-5150f0e0d685";\s*$''']

[[allowlists]]
description = "collection-service IT token subject (UUID), NeighborStatusApiIT"
condition = "AND"
commits = ["17a593af392a2d4b08f8a4db62a7bd003b6928a3"]
paths = ['''^collection-service/src/test/java/pe/esgtrazabilidad/collection/it/NeighborStatusApiIT\.java$''']
regexTarget = "line"
regexes = ['''^\s*private static final String TOKEN_SUBJECT = "01a0d8cb-f219-72a2-b006-5150f0e0d685";\s*$''']

# The alphabet the browser draws initial staff passwords from (public by design).
[[allowlists]]
description = "frontend initial-password alphabet (the directory was frontend-demo/ when the commit was made)"
condition = "AND"
commits = ["f50ba2068377cc69b6e4b83abef9281843140cf0"]
paths = ['''^frontend(-demo)?/src/app/features/staff/initial-password\.ts$''']
regexTarget = "line"
regexes = ['''^\s*export const PASSWORD_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';\s*$''']

# A made-up shared value used only by the email adapter unit tests (not a secret).
[[allowlists]]
description = "auth-service email unit tests webhook value"
condition = "AND"
commits = ["3d75ac21cd1e6b27c4e1e652b0f5ea293d21ae34"]
paths = [
  '''^auth-service/src/test/java/pe/esgtrazabilidad/auth/email/EmailConfigTest\.java$''',
  '''^auth-service/src/test/java/pe/esgtrazabilidad/auth/email/AppsScriptEmailSenderTest\.java$''',
]
regexTarget = "line"
regexes = ['''^\s*private static final String SECRET = "un-secreto-compartido-de-prueba-de-32-caracteres";\s*$''']

# The public demonstration account (v3/cuenta-demo): a STAFF user with fictitious data whose password is published on
# purpose (login button and README) so a visitor can try the system in one click. It protects only fictitious data and
# can be rotated at any time. Each file is allowed alone, only for the exact line it appears on, never by rule.
[[allowlists]]
description = "demonstration account password in the login constant (public by design)"
condition = "AND"
paths = ['''^frontend/src/app/features/login/demo-account\.ts$''']
regexTarget = "line"
regexes = ['''^\s*password: '[A-Za-z0-9]{20}',\s*$''']

[[allowlists]]
description = "demonstration account password in the README (public by design)"
condition = "AND"
paths = ['''^README\.md$''']
regexTarget = "line"
regexes = ['''^- \*\*Contraseña:\*\* `[A-Za-z0-9]{20}`\s*$''']
