databaseChangeLog:
  - changeSet:
      id: v0.3.0-create-password-reset-code-table
      author: esg-trazabilidad
      changes:
        # One row per code sent. Only an HMAC of the code is stored (never the code), and a code
        # is spent by setting consumed_at: used, invalidated by a newer request, or out of attempts.
        - createTable:
            tableName: password_reset_code
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: staff_user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_password_reset_code_staff_user
                    references: staff_user(id)
              - column:
                  name: code_hmac
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: timestamp with time zone
        - sql:
            sql: >
              CREATE UNIQUE INDEX uq_password_reset_code_live
              ON password_reset_code (staff_user_id)
              WHERE consumed_at IS NULL;
            rollback: DROP INDEX uq_password_reset_code_live;
        - sql:
            sql: >
              ALTER TABLE password_reset_code
              ADD CONSTRAINT ck_password_reset_code_attempts CHECK (attempts >= 0);
            rollback: ALTER TABLE password_reset_code DROP CONSTRAINT ck_password_reset_code_attempts;

  - changeSet:
      id: v0.3.0-create-password-reset-request-table
      author: esg-trazabilidad
      changes:
        # What the limits count. Neither the email nor the address is stored: only their HMACs.
        # accepted = the request passed the limits; sent = an email really left (the daily cap counts these).
        - createTable:
            tableName: password_reset_request
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: kind
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: email_hmac
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: ip_hmac
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: requested_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: accepted
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: sent
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE password_reset_request
              ADD CONSTRAINT ck_password_reset_request_kind CHECK (kind IN ('REQUEST', 'CONFIRM', 'NOTICE'));
            rollback: ALTER TABLE password_reset_request DROP CONSTRAINT ck_password_reset_request_kind;
        - createIndex:
            tableName: password_reset_request
            indexName: idx_password_reset_request_email
            columns:
              - column:
                  name: email_hmac
              - column:
                  name: requested_at
        - createIndex:
            tableName: password_reset_request
            indexName: idx_password_reset_request_ip
            columns:
              - column:
                  name: ip_hmac
              - column:
                  name: requested_at
        - createIndex:
            tableName: password_reset_request
            indexName: idx_password_reset_request_at
            columns:
              - column:
                  name: requested_at
