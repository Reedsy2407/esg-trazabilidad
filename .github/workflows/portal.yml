# Documentation portal (portal/, JetBrains Writerside), published to GitHub
# Pages. Kept apart from ci.yml on purpose: it never runs on service or
# frontend changes, so it can't hold up their checks or Render's checksPass
# deploys. See portal/PLAN.md.
#
# - build:  the Writerside builder image, run through portal/scripts/build-local.sh
#           so the builder version and its arguments (-lang es-ES among them)
#           live in one place for both local and CI builds.
# - check:        JetBrains' checker fails the run on any builder error
#                 (broken links, topics missing from the tree, bad XML...).
# - openapi-drift: exports each service's own OpenAPI document (springdoc's
#                 /v3/api-docs, via each service's own OpenApiExportIT/
#                 OpenApiDocsIT test) and compares it against what's
#                 committed under Writerside/specs/. continue-on-error:
#                 true on purpose -- it only informs, same as the rest of
#                 this workflow's path filter: it never runs on a
#                 *-service/src push, so it can't enter Render's
#                 checksPass gate either way. See portal/PLAN.md.
# - catalog-drift: compares the error codes the services declare
#                 (*Errors.java) with the catalog pages under
#                 Writerside/topics/errores/. Informational too.
# - deploy:       main only, and only after build and check. openapi-drift
#                 and catalog-drift never gate it.
name: Portal

on:
  push:
    branches: [main]
    # The workflow file itself too, so a change to a job is exercised by its
    # own push.
    paths:
      - portal/**
      - .github/workflows/portal.yml
  pull_request:
    paths:
      - portal/**
      - .github/workflows/portal.yml
  schedule:
    # Mondays 11:00 UTC (06:00 in Lima).
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Most of this is pulling the builder image (8.78 GB unpacked).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The runner's preinstalled Node is enough: the scripts use builtins only.
      - name: Portal script tests
        run: node --test portal/scripts/gen-adr-toc.test.mjs portal/scripts/export-openapi.test.mjs portal/scripts/catalog-drift.test.mjs

      # build-local.sh also validates every ADR (gen-adr-toc.mjs) and stops on
      # an invalid one before the builder runs.
      - name: Build the portal (Writerside builder in Docker)
        run: bash portal/scripts/build-local.sh

      - uses: actions/upload-artifact@v7
        with:
          name: portal
          # The zip (site) and report.json (what the checker reads). The
          # Algolia index and report.html aren't used.
          path: |
            portal/artifacts/webHelpESG2-all.zip
            portal/artifacts/report.json
          if-no-files-found: error
          retention-days: 7

  check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The checker reads artifacts/report.json relative to the workspace.
      - uses: actions/download-artifact@v4
        with:
          name: portal
          path: artifacts

      - name: Fail on any Writerside error
        uses: JetBrains/writerside-checker-action@v1
        with:
          instance: Writerside/esg

  # Informational only (see the header comment): never blocks deploy, and
  # never runs on a *-service/src push -- same path filter as the rest of
  # this workflow (portal/**, weekly cron, workflow_dispatch).
  openapi-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # One mvn call for all four services: -Dit.test with both class names
      # means a module that has neither name still fails the build (see
      # -DfailIfNoSpecifiedTests=false), while each service only runs the
      # one IT that actually exists in it. This still runs every unit test
      # too (-Dit.test only scopes failsafe) -- surefire-plugin's own `skip`
      # binds to maven.test.skip (which also skips compiling tests) and its
      # `skipTests` binds to the same property name failsafe's own
      # `skipTests` reads, so a flag that skips only surefire while leaving
      # failsafe's IT running doesn't exist out of the box. Checked directly
      # against maven-surefire-plugin/maven-failsafe-plugin 3.2.5's own
      # plugin.xml before writing this -- not worth a custom pom.xml knob
      # just for this informational job.
      - name: Export every service's OpenAPI document
        run: >
          mvn -B -pl recycler-service,collection-service,reporting-service,auth-service -am verify
          -Dit.test=OpenApiExportIT,OpenApiDocsIT -DfailIfNoSpecifiedTests=false

      - name: Copy the exports into Writerside/specs/
        run: node portal/scripts/export-openapi.mjs

      - name: Compare against what's committed
        run: |
          if git diff --exit-code -- portal/Writerside/specs/; then
            echo "No hay desfase: las specs commiteadas coinciden con el código."
          else
            echo "::warning::Las specs OpenAPI commiteadas están desfasadas del código. Corre 'node portal/scripts/export-openapi.mjs' (tras un 'mvn verify' por servicio) y commitea el resultado."
            exit 1
          fi

  # Informational only, same as openapi-drift: a missing or stale code in the
  # catalog is reported as a warning and never blocks the deploy.
  catalog-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Compare the declared error codes with the catalog pages
        run: node portal/scripts/catalog-drift.mjs

  deploy:
    needs: [build, check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One Pages deploy at a time; a newer run waits instead of cancelling one
    # that is already publishing.
    concurrency:
      group: portal-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portal
          path: artifacts

      - name: Unzip the site
        run: unzip -O UTF-8 -qq artifacts/webHelpESG2-all.zip -d site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
