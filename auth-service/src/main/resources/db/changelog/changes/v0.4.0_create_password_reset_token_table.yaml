databaseChangeLog:
  - changeSet:
      id: v0.4.0-create-password-reset-token-table
      author: esg-trazabilidad
      changes:
        # The proof that a code was verified: the person sends it back with the new password. Like the
        # codes, only an HMAC is stored. A token is spent by setting consumed_at (used, replaced by a newer
        # one, or the password changed), and an account has at most one live token.
        - createTable:
            tableName: password_reset_token
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: staff_user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_password_reset_token_staff_user
                    references: staff_user(id)
              - column:
                  name: token_hmac
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: timestamp with time zone
        - sql:
            sql: >
              CREATE UNIQUE INDEX uq_password_reset_token_live
              ON password_reset_token (staff_user_id)
              WHERE consumed_at IS NULL;
            rollback: DROP INDEX uq_password_reset_token_live;

  - changeSet:
      id: v0.4.0-allow-verify-kind-in-password-reset-request
      author: esg-trazabilidad
      changes:
        # The new "verify the code" step is limited by address like the others.
        - sql:
            sql: >
              ALTER TABLE password_reset_request DROP CONSTRAINT ck_password_reset_request_kind;
              ALTER TABLE password_reset_request
              ADD CONSTRAINT ck_password_reset_request_kind CHECK (kind IN ('REQUEST', 'VERIFY', 'CONFIRM', 'NOTICE'));
            rollback: >
              DELETE FROM password_reset_request WHERE kind = 'VERIFY';
              ALTER TABLE password_reset_request DROP CONSTRAINT ck_password_reset_request_kind;
              ALTER TABLE password_reset_request
              ADD CONSTRAINT ck_password_reset_request_kind CHECK (kind IN ('REQUEST', 'CONFIRM', 'NOTICE'));
