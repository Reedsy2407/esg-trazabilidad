spring:
  application:
    name: recycler-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/esg_trazabilidad}
    username: ${DB_USERNAME:esg}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true

server:
  port: 8081
