databaseChangeLog:
  - changeSet:
      id: v0.2.0-add-role-password-and-status-to-staff-user
      author: esg-trazabilidad
      changes:
        - addColumn:
            tableName: staff_user
            columns:
              # Every existing account becomes STAFF; the first ADMIN is chosen at deploy time by
              # AdminBootstrapRunner (ADMIN_BOOTSTRAP_EMAIL), not guessed here.
              - column:
                  name: role
                  type: varchar(10)
                  defaultValue: STAFF
                  constraints:
                    nullable: false
              - column:
                  name: password_changed_at
                  type: timestamp
              - column:
                  name: must_change_password
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              # The last status change (deactivation or reactivation): why, who and when.
              - column:
                  name: status_reason
                  type: varchar(500)
              - column:
                  name: status_changed_by
                  type: uuid
              - column:
                  name: status_changed_at
                  type: timestamp
