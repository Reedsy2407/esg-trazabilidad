# Test-only value. JwtIssuer and shared-kernel's JwtSecurityConfig both
# require JWT_SECRET at startup, so every @SpringBootTest context needs it --
# including the ones that never issue or validate a token (bootstrap,
# persistence ITs). Locally ../.env.local also supplies one; CI has no
# .env.local, so without this those contexts fail to start there. Classes
# that sign or verify tokens pin their own value via @TestPropertySource,
# which wins over this file.
JWT_SECRET=auth-service-test-only-secret-at-least-32-bytes-long

# Test-only. Every auth-service IT logs in from 127.0.0.1, several times per
# context (AuthApiIT alone makes 6+ login calls within seconds), so the
# production limit of 5 per minute per IP (SPEC-deployment.md) would turn
# unrelated tests into 429s. Raised here for them only; LoginRateLimitIT pins
# it back to 5 via @TestPropertySource. Production never sets this property.
esg.auth.login-rate-limit.capacity=1000
